name = "the-chair"
main = "worker.js"
compatibility_date = "2026-05-17"

[vars]
SITE_TITLE = "The Chair"
SITE_DESCRIPTION = "A lightweight blog powered by agents"
GITHUB_BRANCH = "main"

[[kv_namespaces]]
binding = "BLOG_CACHE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_KV_PREVIEW_ID"

[[r2_buckets]]
binding = "BLOG_UPLOADS"
bucket_name = "REPLACE_WITH_R2_BUCKET"
preview_bucket_name = "REPLACE_WITH_R2_PREVIEW_BUCKET"
